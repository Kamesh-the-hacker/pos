<!DOCTYPE html>
<html>
<head>
<title>Login - Meenachi Supermarket</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1f2937,#374151);
    font-family:'Segoe UI',sans-serif;
}

/* CARD */
.login-card{
    width:100%;
    max-width:380px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* TITLE */
.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h2{
    font-weight:bold;
    color:#111827;
}

.logo p{
    color:#6b7280;
    font-size:14px;
}

/* INPUT */
.form-control{
    border-radius:8px;
    padding:10px;
}

/* BUTTON */
.btn-login{
    background:#111827;
    color:white;
    border-radius:8px;
    padding:10px;
    font-weight:500;
}

.btn-login:hover{
    background:#000;
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    color:#6b7280;
}

</style>

</head>

<body>

<div class="login-card">

<!-- LOGO -->
<div class="logo">
    <h2>🛒 Meenachi Supermarket</h2>
    <p>Smart Billing & Inventory System</p>
</div>

<!-- FORM -->
<form method="POST">

<div class="mb-3">
    <label>Username</label>
    <input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
    <label>Password</label>
    <input type="password" name="password" class="form-control" required>
</div>

<button class="btn btn-login w-100">
    <i class="fa fa-sign-in-alt"></i> Login
</button>

</form>

<div class="footer">
    © 2026 Developed by <b>Kamesh</b>
</div>

</div>

</body>
</html>
