{% extends "base.html" %}
{% block content %}

<h4>🧾 Invoice: {{sale.invoice_no}}</h4>

<p><b>Date:</b> {{sale.date.strftime("%d-%m-%Y %H:%M")}}</p>

<div class="card p-3 shadow">

<table class="table table-bordered text-center">

<tr>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>

{% for i in items %}
<tr>
<td>{{i.product_name}}</td>
<td>{{i.qty}}</td>
<td>₹ {{i.price}}</td>
<td>₹ {{i.qty * i.price}}</td>
</tr>
{% endfor %}

</table>

<h4 class="text-end">Total: ₹ {{sale.total}}</h4>

</div>

{% endblock %}
